<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Walky - wallpapers</title>
    <style>
      /* A darkroom, like tools/ogImage.html: nothing here is a surface of the
         app, and the only things that have to look right are the rectangles. */
      body {
        margin: 0; padding: 24px; background: #111; color: #ddd;
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
      }
      figure { margin: 0 0 28px; display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
      figcaption { width: 100%; color: #999; }
      canvas { box-shadow: 0 0 0 1px #333; }
      /* Shown small: these are 3840 and 2796 across and a laptop is not. */
      canvas.desktop { width: 640px; height: 360px; }
      canvas.phone { width: 166px; height: 360px; }
      button {
        font: inherit; padding: 8px 16px; border-radius: 8px;
        border: 1px solid #444; background: #222; color: #eee; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { min-height: 1.5em; color: #999; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="gallery"></div>
    <button id="save" disabled>Save all</button>
    <p id="status">Simulating...</p>
    <script type="module" src="./wallpapers.ts"></script>
  </body>
</html>
