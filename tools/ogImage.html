<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Walky - share card</title>
    <style>
      /* Deliberately plain. This page is a darkroom, not a surface of the app:
         anything styled here would be one more thing to keep in step with the
         chrome for no gain, and the only thing that has to look right is the
         1200x630 rectangle in the middle. */
      body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #111; color: #ddd;
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
      }
      /* Shown at half size: the card is 1200 wide and a laptop is not. */
      canvas { width: 600px; height: 315px; box-shadow: 0 0 0 1px #333; }
      button {
        font: inherit; padding: 8px 16px; border-radius: 8px;
        border: 1px solid #444; background: #222; color: #eee; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { min-height: 1.5em; color: #999; }
    </style>
  </head>
  <body>
    <canvas id="card" width="1200" height="630"></canvas>
    <button id="save" disabled>Save to public/images/og.png</button>
    <p id="status">Drawing...</p>
    <script type="module" src="./ogImage.ts"></script>
  </body>
</html>
