<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    A doorway with people coming out of it, in the same black line art as the
    2016 set: the block on the left is the generator, and the dots leaving it to
    the right are what it makes. Drawn rather than photographed off the original
    toolbar because there was no such tool in 2016 to take an icon from.

    The dots grow as they go, which is the one thing the picture has to say that
    a static block cannot: this is a source, and it has a direction.
  -->
  <g fill="none" stroke="#000" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- The block itself, the square the tool puts down. -->
    <rect x="10" y="26" width="34" height="48" rx="4"/>
    <!-- The opening it lets people out of. -->
    <path d="M44 42 H62"/>
    <path d="M44 58 H62"/>
  </g>
  <g fill="#000">
    <!-- Three abreast, leaving. -->
    <circle cx="62" cy="50" r="6"/>
    <circle cx="80" cy="36" r="7.5"/>
    <circle cx="80" cy="64" r="7.5"/>
  </g>
</svg>
