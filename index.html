<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A pedestrian simulator that runs entirely in the browser. Draw walls, mark a goal, paint a crowd, and watch it find its way." />
    <meta name="theme-color" content="#1E1E1E" />
    <link rel="icon" href="./images/icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iOS reads none of the manifest: the home-screen icon, the app name and
         the standalone display mode each need their own tag.

         Deliberately no viewport-fit=cover, and deliberately not the
         black-translucent status bar: either one draws the page underneath
         iOS's status bar, which then frosts whatever passes below it. Left
         alone, iOS insets the web view under the status bar instead and the
         top of the map is simply the top of the map. "black" keeps the bar's
         text light over the #1E1E1E ground. -->
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Walky" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Walky</title>

    <!--
      Absolute URLs, unlike every other asset reference on this page.
      Vite's base is './' so the bundle stays portable, but link scrapers fetch
      these tags without a document base to resolve against: X and Slack in
      particular drop a relative og:image rather than guessing at it.
    -->
    <link rel="canonical" href="https://walky.ch/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Walky" />
    <meta property="og:url" content="https://walky.ch/" />
    <meta property="og:title" content="Walky - a pedestrian simulator in the browser" />
    <meta
      property="og:description"
      content="A pedestrian simulator that runs entirely in the browser. Draw walls, mark a goal, paint a crowd, and watch it find its way."
    />
    <meta property="og:image" content="https://walky.ch/images/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A crowd of teal and magenta dots funnelling through a gap between two walls and fanning out around an L-shaped wall toward two coloured goals, on a dark background."
    />
    <!-- Without summary_large_image, X crops the picture to a small square. -->
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1E1E1E; }
      /* Without this Safari starts a text/element drag from the canvas and swaps
         in its own drag cursor mid-gesture. */
      #stage, #stage canvas {
        user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
        touch-action: none;
      }
      #stage { position: absolute; inset: 0; }
      #deck-canvas, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
      #overlay { pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="deck-canvas"></canvas>
      <canvas id="overlay"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
